[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lineage-experiment"
version = "0.0.1"
description = "Experimental layered data quality and lineage architecture using synthetic biomedical data"
authors = [{ name = "Michael Penhallegon", email = "mike@hematite.tech" }]
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "dynaconf",
    "deltalake",
    "duckdb",
    "great-expectations",
    "fcsparser",
    "pandas",
    "pyarrow",
    "openlineage-python",
]

[dependency-groups]
dev = [
    "tox >= 4.21",
    "tox-pyenv-redux",
    "ipython",
    "ipdb"
]
testing = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "hypothesis",
]
linting = [
    "ruff~=0.15.0"
]
type_checking = [
    "ty"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "C", "B",
    "D1", "D201", "D202", "D205", "D210", "D212", "D4",
    "E4", "E7", "E9",
    "F", "I", "W",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.hatch.build.targets.wheel]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
addopts = ["--import-mode=importlib"]

[tool.coverage.run]
omit = [
    "*/test/*",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "^/s*/././."
]
exclude_also = [
    "if __name__ == .__main__."
]

[tool.tox]
requires = ["tox>=4.21"]
env_list = ["py313", "py312", "lint", "format"]

[tool.tox.env_run_base]
dependency_groups = ["dev", "testing"]
commands = [[
    "pytest",
    "-v",
    "--cov=lineage_experiment",
    "--cov-report=term-missing",
    { replace = "posargs", extend = true }
]]

[tool.tox.env.lint]
dependency_groups = ["linting"]
commands = [
    ["ruff", "check", {replace = "posargs", default = ["src"], extend = true}]
]

[tool.tox.env.format]
dependency_groups = ["linting"]
commands = [
    ["ruff", "format", "--check", {replace = "posargs", default = ["src"], extend = true}]
]

[tool.tox.env.type_check]
dependency_groups = ["type_checking"]
commands = [
    ["ty", "check", {replace = "posargs", default = ["src"], extend = true}]
]
